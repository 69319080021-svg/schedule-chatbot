<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ตรวจสอบข้อมูลก่อนบันทึก</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div class="admin-box wide">
    <h2>ตรวจสอบข้อมูลก่อนบันทึก</h2>
    {% if error %}<p class="error">{{ error }}</p>{% endif %}
    <p class="hint">กรุณาตรวจสอบความถูกต้องของข้อมูลที่สกัดได้ (โดยเฉพาะวัน เวลา และคาบสอน) แก้ไขได้โดยตรงในช่องด้านล่าง แล้วกดยืนยันบันทึก</p>

    <div class="review-layout">
      <form method="post" action="/admin/save" id="save-form">
        <textarea name="data_json" id="data-json" rows="25">{{ data_json }}</textarea>
        <div class="actions">
          <button type="submit">ยืนยันบันทึก</button>
          <a href="/admin/upload" class="btn-secondary">ยกเลิก / อัปโหลดใหม่</a>
        </div>
      </form>
      <div class="preview">
        <h3>ตัวอย่างตารางสอน</h3>
        <div id="preview-table"></div>
      </div>
    </div>

    <p><a href="/admin/logout">ออกจากระบบ</a></p>
  </div>

  <script src="/static/admin.js"></script>
</body>
</html>
